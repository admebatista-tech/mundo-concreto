<!doctype html>
<html lang="pt-BR">
<head>
<script src="base.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · MUNDO CONCRETO</title>
<link rel="stylesheet" href="a11y.css">
<link rel="stylesheet" href="admin.css">
<script src="a11y.js"></script>
</head>
<body class="tela-entrar">
<main class="entrar" id="conteudo">
  <img src="/mc/marca/logo-mundo-concreto-horizontal.png" alt="MUNDO CONCRETO" class="entrar-logo">
  <h1>Área administrativa</h1>
  <p class="dica">Entre com o seu usuário e senha para editar os cards e as landing pages.</p>
  <form id="form-entrar" novalidate>
    <label>Usuário<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <p class="erro" id="erro" role="alert" aria-live="assertive"></p>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <a class="voltar" href="/">← Voltar ao site</a>
</main>
<script>
document.getElementById('form-entrar').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, erro = document.getElementById('erro');
  erro.textContent = '';
  if (!f.usuario.value.trim() || !f.senha.value) { erro.textContent = 'Preencha usuário e senha.'; return; }
  const r = await fetch('/api/entrar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ usuario: f.usuario.value, senha: f.senha.value }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) location.href = U('/admin'); else { erro.textContent = d.error || 'Não foi possível entrar.'; f.senha.value = ''; f.senha.focus(); }
});
</script>
</body>
</html>
